[package]
name = "hex-cell-map"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native GIS-driven 3D hexagonal map generator"
license = "MIT OR Apache-2.0"
default-run = "hex-cell-map"

[features]
default = ["desktop"]
desktop = ["dep:bevy", "dep:bevy_egui", "dep:sys-locale"]

[dependencies]
anyhow = "1"
bevy = { version = "=0.19.1", optional = true, default-features = false, features = ["default_app", "std", "bevy_winit", "3d_bevy_render", "mesh_picking", "multi_threaded", "default_font", "png"] }
bevy_egui = { version = "=0.42.0", optional = true, default-features = false, features = ["render", "default_fonts", "open_url"] }
sys-locale = { version = "0.3", optional = true }
gdal = { version = "=0.19.0", features = ["gdal-src", "bindgen"] }
gdal-src = { version = "=0.3.0", default-features = false, features = ["driver_gtiff", "driver_shape", "driver_geojson", "driver_mem", "curl-sys"] }
gdal-sys = { version = "0.12", features = ["bundled", "bindgen"] }
geo = { version = "=0.33.1", default-features = false }
hexx = { version = "=0.25.0", default-features = false, features = ["grid", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tempfile = "3"
dirs = "6"
spade = "=2.15.1"
rayon = "1"

[target.'cfg(unix)'.dependencies]
curl-sys = { version = "0.4", features = ["static-curl", "static-ssl"] }

[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

[[bin]]
name = "hex-cell-map"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "gis-probe"
path = "src/bin/gis_probe.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
