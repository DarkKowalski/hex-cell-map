name: Native checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      profile:
        type: string
        default: debug

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  PYTHONUTF8: '1'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            shell: bash
          - os: windows-2022
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 120
    env:
      PACKAGE_PROFILE: ${{ inputs.profile || 'debug' }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite cmake llvm --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          $linker = (Get-Command link.exe -CommandType Application).Source
          if ($linker -notlike '*Microsoft Visual Studio*') {
            throw "Expected the MSVC linker, found $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.PACKAGE_PROFILE }}
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as stream:
              version = tomllib.load(stream)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match Cargo.toml version'
          PY
      - run: cargo fmt --check
      - name: Test native targets
        run: cargo test --locked --all-targets ${{ inputs.profile == 'release' && '--release' || '' }}
      - name: Lint native targets
        run: cargo clippy --locked --all-targets ${{ inputs.profile == 'release' && '--release' || '' }} -- -D warnings
      - name: Build applications
        run: cargo build --locked --bins ${{ inputs.profile == 'release' && '--release' || '' }}
      - name: Bundle and test extracted packages
        shell: bash
        run: |
          tag_args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_args=(--tag "$GITHUB_REF_NAME")
          fi
          python scripts/package.py --profile "$PACKAGE_PROFILE" --archive "${tag_args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
